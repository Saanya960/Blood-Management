<h1>Donate Blood</h1>
<br> <br> <br> <br>
<hr>
<form action="#">
<label for="name"><i>Full Name</i></label>
<input type="text" id="name">
<label for="mob"><i>Mobile Number</i></label> 
<input type="text" id="mob">
<label for="email"><i>Email Id</i></label>
<input type="email" id="email"> <br> <br> <br>
<label for="age"><i>Age</i></label>
<input type=" number" id="age">

<label for="gen"><i>Gender</i></label>
<select name="gen" id="gen">
    <option >Select</option>
    <option value="m">Male</option>
    <option value="f">Female</option>
    <option value="o">Other</option>
</select>
<label for="blood-grp"><i>Blood Group</i></label>
<select name="blood-group" id="blood-grp">
    <option >Select</option>
    <option value="A+">A+</option>
    <option value="A-">A-</option>
    <option value="B+">B+</option>
    <option value="B-">B-</option>
    <option value="O+">O+</option>
    <option value="O-">O-</option>
    <option value="AB+">AB+</option>
    <option value="AB-">AB-</option>
</select>
<br> <br> <br>
<i>Address</i> <br>
 <textarea name="address" id="address"></textarea> <br> <br>
<button type="submit">Submit</button> <br> <br><br><br><br><br><br><br><br><br><br>
